name: Build firmware & deploy web flasher

# Builds the ESP32-S3 firmware, merges it into a single binary, and publishes the
# browser web-flasher (web/flash/) to GitHub Pages so makers can flash from Chrome/Edge.
#
# One-time setup in the repo: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build firmware (all boards)
        run: |
          pio run -e esp32-s3-amoled-175
          pio run -e esp32-s3-amoled-143
          pio run -e esp32-s3-lcd-28c
          pio run -e esp32-s3-touch-lcd-28c
          pio run -e esp32-p4-lcd-34c

      - name: Host tests
        run: ./tests/run_host_tests.sh

      - name: Merge flashable binaries (all boards)
        run: |
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin -path '*framework-arduinoespressif32*' | head -1)"
          mkdir -p site
          cp web/flash/index.html web/flash/manifest.json web/flash/manifest-amoled143.json web/flash/manifest-lcd28c.json web/flash/manifest-touchlcd28c.json web/flash/manifest-lcd34c.json site/
          # stamp the flasher page + manifests with the firmware version being built
          VER=$(grep -oE 'FW_VERSION "[0-9.]+"' src/config.h | grep -oE '[0-9.]+' | head -1)
          sed -i "s/__FWVER__/${VER:-dev}/g" site/index.html site/manifest.json site/manifest-amoled143.json site/manifest-lcd28c.json site/manifest-touchlcd28c.json site/manifest-lcd34c.json
          merge() {   # merge <pio-env> <output-bin> [chip] [bootloader-offset] (P4: esp32p4 0x2000)
            python -m esptool --chip "${3:-esp32s3}" merge_bin -o "$2" \
              --flash_mode dio --flash_freq 80m --flash_size 16MB \
              "${4:-0x0}" ".pio/build/$1/bootloader.bin" \
              0x8000  ".pio/build/$1/partitions.bin" \
              0xe000  "$BOOT_APP0" \
              0x10000 ".pio/build/$1/firmware.bin"
          }
          merge esp32-s3-amoled-175 site/CapsuleRadar-esp32s3.bin
          merge esp32-s3-amoled-143 site/CapsuleRadar-esp32s3-amoled143.bin
          merge esp32-s3-lcd-28c    site/CapsuleRadar-esp32s3-lcd28c.bin
          merge esp32-s3-touch-lcd-28c site/CapsuleRadar-esp32s3-touchlcd28c.bin
          merge esp32-p4-lcd-34c    site/CapsuleRadar-esp32p4-lcd34c.bin esp32p4 0x2000

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
