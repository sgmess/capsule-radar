; Standalone board bring-up probe — NOT part of the firmware build.
; Open this directory as its own PlatformIO project:
;     cd tools/bringup && pio run -t upload && pio device monitor -b 115200
;
; Deliberately depends on nothing from ../../src: the whole point is to answer
; "are these pins right?" before any of the real firmware is in the picture.

[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Matches both supported boards (8 MB PSRAM / 16 MB flash). Adjust for a new target.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps = moononournation/GFX Library for Arduino @ 1.6.4
