; Capsule Radar
;
; Environments:
;   esp32-s3-amoled-175  -> firmware for the reference Waveshare ESP32-S3-Touch-AMOLED-1.75
;   esp32-s3-amoled-143  -> firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.43
;   esp32-s3-lcd-28c     -> firmware for the Waveshare ESP32-S3-LCD-2.8C (non-touch, ST7701 RGB)
;   esp32-s3-touch-lcd-28c -> firmware for the Waveshare ESP32-S3-Touch-LCD-2.8C (same + GT911 touch)
;   native               -> desktop LVGL simulator (SDL2), runs the same UI on the Mac
;
; The board envs share the sources and differ by a -DBOARD_* flag; the pin map, panel,
; touch driver and peripheral set live in src/boards/board_*.h. The two AMOLED envs are
; otherwise identical; the 2.8C also needs its own platform + sdkconfig (see its env).
;
; Build/run the simulator:   pio run -e native -t exec
; Build/flash the device:    pio run -e esp32-s3-amoled-175 -t upload
;                            pio run -e esp32-s3-amoled-143 -t upload
;                            pio run -e esp32-s3-lcd-28c -t upload
;                            pio run -e esp32-s3-touch-lcd-28c -t upload

[amoled_common]
; pioarduino fork of the espressif32 platform (Arduino core 3.x / ESP-IDF 5.x).
; This exact release is what the reference board builds use and is already installed
; locally; swap to "espressif32" (registry) if you prefer the official platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1      ; generic S3; both boards are 8MB PSRAM / 16MB flash
; Pin the core AND its prebuilt IDF libs to exactly what 53.03.13 expects. PlatformIO
; keeps ONE global package dir, so without this a newer platform's packages (e.g. the
; 2.8C env's 3.3.x core, or another project's) silently satisfy this env and the build
; breaks (missing sdkconfig.h) or, worse, links a mismatched IDF. With the pins, switching
; to an env whose pair is not the one installed simply reinstalls it (slower, but right).
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.1.3/esp32-3.1.3.zip
    framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.3/esp32-arduino-libs-idf-release_v5.3-489d7a2b-v1.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; sim_main.cpp is desktop-only (has its own main() + SDL); keep it out of the firmware
build_src_filter = +<*> -<sim_main.cpp>

; ESP32-S3R8: QIO flash + OPI PSRAM, 16 MB flash + matching partition table
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Everything but the USB-serial choice, which differs per board: the AMOLEDs log over
; the S3's native USB (CDC), the 2.8C boards over a CH343P bridge on UART0. Kept out
; of the shared list so no env ever defines it twice (the 2.8C hybrid IDF build
; applies build_flags to IDF components with -Werror and ignores build_unflags there).
flags_common =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0              ; silence Arduino library [E] spam (Wire I2C -1/263, ssl_client);
                                      ;   our own Serial.printf [adsb]/[gps]/[wifi] logs are unaffected
    -DPNG_MAX_BUFFERED_PIXELS=8192    ; 512px RGBA scanlines need (512*4+1)*2 = 4098, but sizing the
                                      ;   buffer EXACTLY let PNGdec run past it inside its PSRAM object,
                                      ;   silently corrupting the neighbouring heap block (weather image
                                      ;   corruption bands, random hangs, intermittent fetch failures —
                                      ;   a different victim every boot). 2x headroom fixes it. Found by
                                      ;   @ijord with CONFIG_HEAP_POISONING on his 2.8-inch port.
    -DLV_CONF_INCLUDE_SIMPLE          ; LVGL does #include "lv_conf.h"
    -I"${PROJECT_DIR}/include"        ; ...and finds it here (PIO's auto include/ is not on the LIBRARY path)
    -std=gnu++17
build_flags =
    ${amoled_common.flags_common}
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4   ; has Arduino_CO5300 + Arduino_ESP32QSPI
    lvgl/lvgl @ 8.4.0                                  ; lv_conf.h in include/ targets v8
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    lewisxhe/XPowersLib                               ; AXP2101 battery gauge
    bodmer/TJpg_Decoder                               ; JPEG decode for aircraft photos
    mikalhart/TinyGPSPlus                             ; NMEA parsing for the LC76G GPS (-G variant)
    bitbank2/PNGdec                                   ; decode RainViewer radar tiles into RGB565
; Notes:
; - lv_conf.h lives in include/ (added to the include path above).
; - Versions are pinned to a known-good combination for this panel; bump deliberately.

; --- Board: Waveshare ESP32-S3-Touch-AMOLED-1.75 (reference) -----------------
[env:esp32-s3-amoled-175]
extends = amoled_common
; no -DBOARD_* flag: src/config.h defaults to the 1.75 board header.

; --- Board: Waveshare ESP32-S3-Touch-AMOLED-1.43 -----------------------------
; Same SoC, PSRAM and flash as the 1.75, but a different pin map, an FT3168 touch
; controller instead of the CST9217, and no PMIC/audio codec. See
; src/boards/board_amoled_143.h -- those pins are confirmed on hardware.
[env:esp32-s3-amoled-143]
extends = amoled_common
build_flags =
    ${amoled_common.build_flags}
    -DBOARD_AMOLED_143

; --- Board: Waveshare ESP32-S3-LCD-2.8C (non-touch) --------------------------
; Same SoC/PSRAM/flash, but an ST7701 480x480 IPS on the 16-bit parallel RGB bus, a
; TCA9554 IO expander, a buzzer instead of the ES8311, an ADC divider instead of the
; AXP2101, and NO touch (the BOOT button navigates). See src/boards/board_lcd_28c.h.
; Board support lifted from @ijord's port (https://github.com/ijord/capsule-radar),
; including everything below, which is what made the RGB panel stable there.
[env:esp32-s3-lcd-28c]
extends = amoled_common
; Newer pioarduino than the AMOLED envs: the "custom_sdkconfig" hybrid compile (needed
; for the XIP flags below) is broken in 53.03.13 and matured in the 55.x line. Pin the
; core + libs this platform expects.
; 55.03.312, not the 55.03.311 @ijord's port was proven on: PlatformIO Core 6.2 runs
; builds with SCons 4.11, which dropped SCons.Tool.FortranCommon, and 311's build
; scripts still import it (ModuleNotFoundError at the link step). 312 is the patch
; release written for the newer SCons. Core 3.3.11 -> 3.3.12 is a patch bump too.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12-libs.tar.xz
build_flags =
    ${amoled_common.flags_common}
    -DBOARD_LCD_28C
    -O2                               ; @ijord's setting: the compositor + LVGL blend hot paths
                                      ;   gain 10-20% over the default -Os
    -DARDUINO_USB_CDC_ON_BOOT=0       ; the USB-C port is a CH343P USB-UART bridge on UART0
                                      ;   (GPIO43/44), not the S3's native USB: Serial must go
                                      ;   to UART0 or the log never reaches the USB-C cable
build_unflags = -std=gnu++11 -Os
; XIP from PSRAM, exactly what Waveshare's demos enable. Without it the RGB panel's
; bounce-buffer ISR reads the PSRAM framebuffer while a flash write has the cache
; disabled -> instant panic ("Cache disabled but cached memory region accessed") on
; every NVS write. pioarduino rebuilds the core libs with these on the FIRST build
; (slow once, then cached).
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
; ^ RESTART_IN_VSYNC: scanout underrun self-heal. Without it a starved bounce buffer
;   leaves the ST7701 permanently shifted/garbled below the starve line until reboot;
;   with it the driver resyncs at the next VSYNC.
;   DATA_CACHE_LINE_64B: from Waveshare's own sdkconfig.defaults for this board (the
;   Arduino core default is 32 B). Doubles the burst size of every PSRAM fetch, which
;   is what the bounce-buffer filler lives on: more headroom against the underruns
;   that shift the image.
; Drop IDF components the Arduino core bundles but this project never touches: skips
; ~500 MB of downloads and shortens the one-time hybrid rebuild. mDNS stays in
; (ArduinoOTA/espota uses it); esp-dsp stays in (PNGdec's S3 SIMD asm includes it).
custom_component_remove =
    espressif/esp-sr
    espressif/esp-dl
    espressif/esp_new_jpeg
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/network_provisioning
    espressif/esp_modem
    espressif/esp-modbus
    espressif/cbor
    espressif/qrcode
    chmorgan/esp-libhelix-mp3
; Flash/PSRAM at the stock 80 MHz. 120 MHz was tried on this board and crashed in the
; first-boot memory retune.
board_build.f_flash = 80000000L
; the hybrid-compile stage resolves the partition CSV against the project dir, not the
; framework's tools/partitions: give it the full path (same table as the AMOLED envs)
board_build.partitions = ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/default_16MB.csv
; no Arduino_GFX (the esp_lcd RGB panel driver is built into the core) and no
; XPowersLib (no AXP2101)
lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    bodmer/TJpg_Decoder
    mikalhart/TinyGPSPlus
    bitbank2/PNGdec

; --- Board: Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C ---------------------------
; A different SoC: ESP32-P4 (RISC-V), 32 MB flash / 32 MB PSRAM, 800x800 round JD9365
; panel over 2-lane MIPI-DSI, GT911-family touch, and Wi-Fi from an ESP32-C6 over SDIO
; (esp_hosted). See src/boards/board_p4_lcd_34c.h.
; SILICON REVISION decides the platform. Current XC boards ship ESP32-P4 v3.x (the
; 3.4C this was brought up on reads v3.2). The IDF 5.3 libs of the AMOLEDs' 53.03.13 boot
; only v0.x-v1.x (REV_MAX_FULL 199: what Skyglass's older 4C has); the core 3.3.12 libs
; cover v3.01-v3.99 (REV_MIN_FULL 301 / REV_MAX_FULL 399), so this env uses the same
; platform + core as the 2.8C envs. Prebuilt libs, no custom_sdkconfig. A v1.x board
; would need the 53.03.13 platform instead (see docs/HARDWARE.md).
; boards/ holds the board JSON (the generic esp32-p4 target assumes 4 MB flash).
[env:esp32-p4-lcd-34c]
extends = amoled_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12-libs.tar.xz
board = waveshare_esp32p4_wifi6_lcd_xc
board_build.arduino.memory_type = qio_qspi   ; the P4 prebuilt-lib variant (not the S3's qio_opi)
board_build.psram_type = hex
board_build.flash_mode = qio
board_upload.flash_size = 32MB
build_flags =
    -DBOARD_P4_LCD_34C
    -DCORE_DEBUG_LEVEL=0
    -DPNG_MAX_BUFFERED_PIXELS=8192
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
; no Arduino_GFX (DSI goes through esp_lcd), no XPowersLib (no PMIC) and no WiFiManager
; (it needs a native PHY; wifi_setup.cpp replaces it)
lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TJpg_Decoder
    mikalhart/TinyGPSPlus
    bitbank2/PNGdec

; --- OTA upload (flash over WiFi) -------------------------------------------
; Device must be powered and on WiFi. Then:  pio run -e esp32-s3-amoled-175-ota -t upload
[env:esp32-s3-amoled-175-ota]
extends = env:esp32-s3-amoled-175
upload_protocol = espota
upload_port = capsuleradar.local

[env:esp32-s3-amoled-143-ota]
extends = env:esp32-s3-amoled-143
upload_protocol = espota
upload_port = capsuleradar.local

; --- Board: Waveshare ESP32-S3-Touch-LCD-2.8C ---------------------------------
; The same board plus a GT911 touch controller (panel, pins and init sequence match
; the non-touch demo byte for byte), so it reuses the env above wholesale. Touch
; replaces the BOOT-button navigation. See src/boards/board_touch_lcd_28c.h.
[env:esp32-s3-touch-lcd-28c]
extends = env:esp32-s3-lcd-28c
build_flags =
    ${amoled_common.flags_common}
    -DBOARD_TOUCH_LCD_28C
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=0       ; same CH343P USB-UART bridge (see the env above)

[env:esp32-s3-touch-lcd-28c-ota]
extends = env:esp32-s3-touch-lcd-28c
upload_protocol = espota
upload_port = capsuleradar.local

[env:esp32-p4-lcd-34c-ota]
extends = env:esp32-p4-lcd-34c
upload_protocol = espota
upload_port = capsuleradar.local

[env:esp32-s3-lcd-28c-ota]
extends = env:esp32-s3-lcd-28c
upload_protocol = espota
upload_port = capsuleradar.local

; --- Desktop LVGL simulator (SDL2) -------------------------------------------
[env:native]
platform = native
; Only the portable UI + the SDL sim main; no Arduino_GFX / WiFi / device code.
build_src_filter = -<*> +<radar_view.cpp> +<ui.cpp> +<route.cpp> +<photo.cpp> +<weather.cpp> +<wx_radar.cpp> +<cloud_image.cpp> +<coastline.cpp> +<airports.cpp> +<sim_main.cpp>
build_flags =
    !sdl2-config --cflags --libs      ; SDL2 include/lib flags (Homebrew sdl2)
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -DLV_LOG_PRINTF=1
    -std=gnu++17
lib_deps =
    lvgl/lvgl @ 8.4.0
